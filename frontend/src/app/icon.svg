<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 38 38" fill="none">
  <!-- Static file, so the design tokens can't be referenced by name here.
       These are the resolved sRGB values of accent-teach / accent-learn /
       primary; the media query mirrors the app's dark palette. -->
  <style>
    .teach { fill: #00656F; }
    .learn { fill: #9B3500; }
    .lens  { fill: #48408B; }
    @media (prefers-color-scheme: dark) {
      .teach { fill: #13BBC2; }
      .learn { fill: #FC9B6F; }
      .lens  { fill: #A495F0; }
    }
  </style>
  <circle cx="17.5" cy="24" r="11" class="teach"/>
  <circle cx="30.5" cy="24" r="11" class="learn"/>
  <path d="M24 15.13A11 11 0 0 1 24 32.87A11 11 0 0 1 24 15.13Z" class="lens"/>
</svg>
