[features]
hooks = true

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

[mcp_servers.shadcn]
command = "pnpm"
args = [
    "dlx",
    "shadcn@latest",
    "mcp",
]

[mcp_servers.vercel]
url = "https://mcp.vercel.com"
